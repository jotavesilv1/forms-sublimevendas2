<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Processo seletivo | Time de vendas Sublime Floricultura</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#2b2b2d;--cd:#3a3a3c;--tx:#f5f5f7;--mu:#a1a1a6;--ac:#ff3b8d;--ln:#505054}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 17px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
#bar{position:fixed;top:0;left:0;height:3px;background:var(--ac);width:0;transition:width .4s;z-index:5}
main{max-width:680px;margin:0 auto;padding:7vh 20px 96px;min-height:100dvh}
.s{animation:in .4s ease both}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.n{color:var(--ac);font-weight:600;font-size:14px;margin-bottom:12px;letter-spacing:.02em}
h1,h2{font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:0 0 14px}
h1{font-size:clamp(32px,7vw,46px)}h2{font-size:clamp(24px,5vw,31px)}
.h{color:var(--mu);margin:0 0 26px;font-size:16px}
input[type=text],input[type=number],input[type=tel],textarea{width:100%;background:var(--cd);border:1px solid var(--ln);color:var(--tx);font:inherit;font-size:18px;padding:14px 16px;border-radius:12px;outline:0}
textarea{min-height:160px;resize:vertical}
input:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(255,59,141,.18)}
::placeholder{color:#8a8a8e}
.b{display:inline-block;background:var(--ac);color:#fff;border:0;border-radius:980px;padding:12px 26px;font:600 16px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;cursor:pointer;margin-top:24px}
.b:disabled{opacity:.5}
.g{background:transparent;color:var(--mu);border:1px solid var(--ln);margin-left:10px}
.o{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--cd);border:1px solid var(--ln);color:var(--tx);border-radius:14px;padding:15px 16px;margin:0 0 10px;font:inherit;font-size:16px;cursor:pointer}
.o:hover{border-color:#76767a}
.o.on{border-color:var(--ac);box-shadow:0 0 0 3px rgba(255,59,141,.18)}
.o i{font-style:normal;font-weight:600;color:var(--ac);min-width:20px}
.m{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:20px}
.m audio{width:100%;margin-top:14px}
.m .b{margin:0 10px 0 0}
.er{color:#ff9fc3;margin-top:12px;min-height:22px;font-size:15px}
.tip{font-size:14px;color:var(--mu);margin-top:14px}
.rec{color:var(--ac);font-weight:600}
#nav{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));right:18px;display:flex;gap:8px}
#nav button{background:var(--cd);color:var(--tx);border:1px solid var(--ln);border-radius:50%;width:40px;height:40px;font-size:17px;cursor:pointer}
.cap{margin-bottom:28px}.cap img{width:100%;display:block;border-radius:22px}</style></head><body>
<div id="bar"></div><main id="app"></main>
<div id="nav"><button id="up" aria-label="Anterior">↑</button><button id="dn" aria-label="Próxima">↓</button></div>
<script>
const WHATS="";// número que recebe as respostas por WhatsApp, ex: 5513999999999
const OBRIGATORIAS=typeof claude==="undefined";// obrigatórias no site publicado; no preview do Claude fica livre
const Q=[
{k:"nome",t:"text",q:"Para começar, qual é o seu nome completo?",req:1},
{k:"idade",t:"text",q:"Quantos anos você tem?",req:1,type:"number"},
{k:"zap",t:"text",q:"Qual é o seu WhatsApp com DDD?",h:"Exemplo: 13 99999 9999. É por ele que entraremos em contato.",req:1,type:"tel"},
{k:"cv",t:"file",q:"Anexe seu currículo",h:"PDF ou documento. Se não tiver, conte sua trajetória na próxima pergunta."},
{k:"exp",t:"long",q:"Conte sua experiência real com vendas.",h:"Onde trabalhou, o que vendia, por quanto tempo e qual era sua responsabilidade. Se nunca vendeu diretamente, conte experiências que mostrem sua capacidade de atender e convencer.",req:1},
{k:"c1",t:"choice",q:"Chega um lead do anúncio dizendo: “Quero presentear minha namorada.” Qual é a melhor primeira resposta?",o:[
["Envia o catálogo completo e pergunta: “Qual você quer?”",0],
["“Que lindo! É para uma data especial? Me conta como ela é, que eu indico o buquê perfeito.”",2],
["“Temos buquês a partir de R$ 89. Quanto você quer gastar?”",0],
["“Amei! Antes de mostrar as opções: é aniversário, surpresa ou um pedido de desculpas? Assim eu já sugiro o tom certo e o cartão ideal.”",2]]},
{k:"c2",t:"choice",q:"O cliente espera o pedido há muito tempo e ameaça cancelar. O que você faz primeiro?",o:[
["Responde: “Já está a caminho, é só aguardar.”",0],
["Diz que o atraso é culpa do trânsito e do motoboy, e que não depende de você.",0],
["Confirma com a entrega onde o pedido está, pede desculpas com transparência, passa um horário real e oferece um mimo, como cartão ou chocolate, pelo transtorno.",2],
["Oferece 5% de desconto de imediato, antes de saber o que está acontecendo.",1]]},
{k:"audio",t:"audio",max:90,q:"Cenário em áudio. O cliente mandou: “Meu pedido era para as 14h, já são 16h e minha namorada está esperando. Isso é um absurdo!”",h:"Grave sua resposta como se fosse enviá-la agora pelo WhatsApp, com até 90 segundos. O tom de voz também será avaliado."},
{k:"c3",t:"choice",q:"O cliente escolheu um buquê de R$ 129. Como você aumenta o ticket sem incomodar?",o:[
["Oferece cartão, chocolate, balão, pelúcia e vinho de uma só vez, para ele escolher.",0],
["Não oferece nada para não incomodar.",0],
["Pergunta o que ele quer dizer a ela e sugere um cartão personalizado com essa mensagem, citando o chocolate como complemento natural.",2],
["Pergunta se será um jantar ou uma surpresa em casa e sugere apenas o complemento que combina com a ocasião.",2]]},
{k:"c4",t:"choice",q:"O cliente diz: “Achei muito caro.” Qual é a melhor reação?",o:[
["Dá desconto na hora para não perder a venda.",0],
["“É o valor, a qualidade é essa.”",0],
["Pergunta o que mais pesou e apresenta uma opção dentro do orçamento que ainda emocione, mostrando o que torna o buquê especial.",2],
["Reforça o valor (flores frescas, montagem e entrega cuidadosa) e propõe uma versão menor com cartão personalizado.",2]]},
{k:"c5",t:"choice",q:"Entregamos um buquê com cor diferente da combinada e a cliente reclama. O que você faz?",o:[
["Pede prints da conversa para provar que o combinado foi outro.",0],
["Diz que a cor pode variar conforme a flor da estação.",0],
["Assume o erro, pede desculpas sem rodeios, pergunta se ainda dá tempo para a data e apresenta a solução (refazer ou compensar) já com prazo.",2],
["Pede desculpas, oferece o reenvio imediato e informa que vai acompanhar até a entrega.",2]]},
{k:"metodo",t:"long",q:"Descreva seu processo comercial do primeiro contato ao pagamento.",h:"Quais etapas você segue, como decide o próximo passo e como percebe que o cliente está pronto para fechar?",req:1},
{k:"retorno",t:"long",q:"O cliente recebeu opções e preços, parou de responder e não comprou. Como você retoma o contato?",h:"Quando volta a falar, o que escreve e quando decide parar de insistir?",req:1},
{k:"result",t:"long",q:"Qual foi seu melhor resultado em vendas ou atendimento e como você chegou nele?",h:"Conte uma situação real: uma meta batida, um cliente difícil conquistado ou uma venda que você virou.",req:1},
{k:"teste",t:"long",q:"Teste prático. O cliente escreve: “Oi! Quero um presente para minha namorada. Estou olhando algumas opções, mas ainda não decidi. O que vocês têm?”",h:"Escreva a conversa como se fosse no WhatsApp, da primeira resposta até o fechamento: descoberta da necessidade, sugestão, complemento e próximo passo. Não existe resposta pronta, queremos avaliar sua estratégia e sua execução.",req:1}
];
const CAPA=(()=>{let p="";for(let a=0;a<360;a+=45)p+=`<ellipse rx="17" ry="42" cy="-30" transform="rotate(${a})" fill="#ff3b8d" opacity=".55"/>`;for(let a=22;a<360;a+=45)p+=`<ellipse rx="13" ry="30" cy="-20" transform="rotate(${a})" fill="#ff7fb3" opacity=".8"/>`;return'<svg viewBox="0 0 400 180" width="100%" style="display:block;border-radius:22px;background:#343436"><g transform="translate(200 90)">'+p+'<circle r="9" fill="#ffe3ee"/></g></svg>'})();
const A={},M={},S={};let i=-1;
const $=s=>document.querySelector(s),app=$("#app");
Q.forEach(q=>{if(q.o)q.o=q.o.map(x=>({x:x[0],p:x[1],r:Math.random()})).sort((a,b)=>a.r-b.r)});
function el(h){const d=document.createElement("div");d.innerHTML=h;return d.firstElementChild}
function go(n){i=Math.max(-1,Math.min(Q.length,n));$("#bar").style.width=Math.max(0,i)/Q.length*100+"%";draw();window.scrollTo(0,0)}
function draw(){app.innerHTML="";const s=el('<section class="s"></section>');app.appendChild(s);
 if(i<0){s.innerHTML='<div class="cap" id="cap">'+CAPA+'</div><div class="n">Processo seletivo</div><h1>Faça parte do time de vendas da Sublime Floricultura</h1><p class="h">Procuramos alguém com experiência e vontade de vender pelo WhatsApp: entender a ocasião, indicar o buquê certo e conduzir cada cliente a uma venda ou a um bom atendimento, sempre no padrão que nossos clientes elogiam.<br><br>Responda com calma e foco. Todas as respostas serão avaliadas em situações reais de atendimento. Você vai escrever, escolher alternativas e gravar um áudio, em cerca de 15 minutos.</p><button class="b" id="go">Começar</button>';$("#go").onclick=()=>go(0);const im=new Image();im.onload=()=>{$("#cap").innerHTML="";$("#cap").appendChild(im)};im.src="capa.jpg";return}
 if(i>=Q.length){fim(s);return}
 const q=Q[i];s.innerHTML='<div class="n">Pergunta '+(i+1)+' de '+Q.length+'</div><h2></h2><p class="h"></p><div id="in"></div><div class="er" id="er"></div>';
 s.querySelector("h2").textContent=q.q;s.querySelector(".h").textContent=q.h||"";const b=$("#in");
 if(q.t=="text"){const f=el('<input>');f.type=q.type||"text";f.value=A[q.k]||"";f.placeholder="Digite aqui";f.oninput=()=>A[q.k]=f.value;f.onkeydown=e=>{if(e.key=="Enter")next()};b.appendChild(f);setTimeout(()=>f.focus(),300)}
 if(q.t=="long"){const f=el('<textarea></textarea>');f.value=A[q.k]||"";f.placeholder="Escreva aqui";f.oninput=()=>A[q.k]=f.value;b.appendChild(f)}
 if(q.t=="choice"){q.o.forEach((o,j)=>{const c=el('<button class="o"><i></i><span></span></button>');c.querySelector("i").textContent="ABCD"[j];c.querySelector("span").textContent=o.x;if(S[q.k]===j)c.classList.add("on");c.onclick=()=>{S[q.k]=j;A[q.k]=o.x;b.querySelectorAll(".o").forEach(z=>z.classList.remove("on"));c.classList.add("on");setTimeout(next,350)};b.appendChild(c)})}
 if(q.t=="file"){const m=el('<div class="m"><input type="file" id="fl" style="font-size:16px"><div class="tip" id="fn"></div></div>');b.appendChild(m);if(M[q.k])$("#fn").textContent="Anexado: "+M[q.k].name;$("#fl").onchange=e=>{const f=e.target.files[0];if(f&&f.size>2.5e6){$("#er").textContent="Arquivo grande demais. Envie um PDF de até 2,5 MB.";e.target.value="";return}M[q.k]=f;A[q.k]=M[q.k]?M[q.k].name:"";$("#fn").textContent="Anexado: "+M[q.k].name}}
 if(q.t=="audio")audioUI(q,b);
 b.appendChild(el('<div><button class="b" id="ok">'+(i==Q.length-1?"Revisar e enviar":"Continuar")+'</button></div>'));$("#ok").onclick=next}
function next(){const q=Q[i];
 if(OBRIGATORIAS){if(q.req&&!(A[q.k]||"").toString().trim()){$("#er").textContent="Responda para continuar.";return}
  if(q.t=="long"&&(A[q.k]||"").trim().length<40){$("#er").textContent="Conte um pouco mais, queremos conhecer seu raciocínio.";return}}
 go(i+1)}
const IG=/Instagram|FBAN|FBAV/i.test(navigator.userAgent);
function audioUI(q,b){const ok=!!(navigator.mediaDevices&&window.MediaRecorder);
 const m=el('<div class="m">'+(IG?'<div class="tip" style="color:#ff9fc3;margin:0 0 14px">Você abriu pelo Instagram. Para gravar, toque nos três pontinhos e escolha “Abrir no navegador”. Ou envie um áudio pelo seletor abaixo.</div>':'')+(ok?'<button class="b" id="rc" style="margin-top:0">Gravar áudio</button><span id="tm" class="tip"></span>':'')+'<div id="pv"></div><div class="tip">'+(ok?'Permita o microfone quando o navegador pedir. Se não funcionar, ':'')+'envie um áudio já gravado no seu celular:</div><input type="file" id="af" accept="audio/*" style="font-size:15px;margin-top:8px"></div>');b.appendChild(m);
 const pv=m.querySelector("#pv"),rc=m.querySelector("#rc");function show(){pv.innerHTML="";if(M[q.k]){const p=document.createElement("audio");p.controls=true;p.src=URL.createObjectURL(M[q.k]);pv.appendChild(p);if(rc)rc.textContent="Regravar"}}show();
 m.querySelector("#af").onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>3e6){$("#er").textContent="Áudio grande demais (máximo 3 MB).";e.target.value="";return}M[q.k]=f;A[q.k]="[áudio enviado]";$("#er").textContent="";show()};
 if(!rc)return;let mr,st,tmr;rc.onclick=async()=>{
  if(mr&&mr.state=="recording"){mr.stop();return}
  try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){$("#er").textContent=e.name=="NotAllowedError"?"Microfone bloqueado. Libere nas permissões do navegador (no Safari, toque em aA na barra) e tente de novo.":"Não consegui acessar o microfone. Use o seletor de arquivo abaixo.";return}
  $("#er").textContent="";const mt=["audio/webm;codecs=opus","audio/mp4","audio/webm","audio/ogg"].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||"";
  const ch=[];mr=mt?new MediaRecorder(st,{mimeType:mt}):new MediaRecorder(st);mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
  mr.onstop=()=>{clearInterval(tmr);st.getTracks().forEach(t=>t.stop());M[q.k]=new Blob(ch,{type:mr.mimeType||mt||"audio/mp4"});A[q.k]="[áudio gravado]";m.querySelector("#tm").textContent="";show()};
  mr.start(1000);let n=0;rc.textContent="Parar gravação";tmr=setInterval(()=>{n++;m.querySelector("#tm").innerHTML=' <span class="rec">Gravando '+n+"s</span> de "+q.max+"s";if(n>=q.max)mr.stop()},1000)}}
function pontos(){let p=0,t=0;Q.filter(q=>q.t=="choice").forEach(q=>{t+=2;if(S[q.k]!=null)p+=q.o[S[q.k]].p});return[p,t]}
function resumo(){const[p,t]=pontos();let r="Candidatura Sublime: "+(A.nome||"")+"\nNota da múltipla escolha: "+p+"/"+t+"\n";Q.forEach((q,j)=>{if(q.t!="file")r+="\n"+(j+1)+". "+q.q+"\nResposta: "+(A[q.k]||"sem resposta")+"\n"});return r}
function fim(s){const[p,t]=pontos();const nm=(A.nome||"").split(" ")[0].replace(/[<>&]/g,"");
 s.innerHTML='<div class="n">Última etapa</div><h2>'+(nm?"Tudo pronto, "+nm+"?":"Tudo pronto?")+'</h2><p class="h">Você pode voltar pelas setas e revisar o que quiser. Quando estiver satisfeito, envie suas respostas.</p><button class="b" id="en">Enviar respostas</button><div class="er" id="er"></div>';
 $("#en").onclick=async()=>{$("#en").disabled=true;$("#er").textContent="Enviando";let ok=false;
  try{const f=b=>b?new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(",")[1]);x.readAsDataURL(b)}):null;const au=M.audio,cv=M.cv;
   const ext=au?(/mp4|aac|m4a/.test(au.type)?"m4a":/ogg/.test(au.type)?"ogg":/mpeg|mp3/.test(au.type)?"mp3":/wav/.test(au.type)?"wav":"webm"):"";
   const body={nome:A.nome||"",idade:A.idade||"",zap:A.zap||"",nota:p+"/"+t,respostas:Q.filter(q=>q.t!="file"&&q.t!="audio").map(q=>({q:q.q,r:A[q.k]||""})),audio:await f(au),audioType:au&&au.type,audioExt:ext,cv:await f(cv),cvName:cv&&cv.name,cvType:cv&&cv.type};
   const r=await fetch("/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});ok=r.ok}catch(e){}
  if(!ok&&typeof claude!="undefined"){try{const db=await claude.use("db");if(db){await db.doc("respostas/"+Date.now()).set({nome:A.nome||"",nota:p+"/"+t,texto:resumo().slice(0,200000),em:new Date().toISOString()});ok=true}}catch(e){}}
  const txt=resumo();
  s.innerHTML=ok?'<h1>Respostas enviadas</h1><p class="h">Suas respostas foram enviadas e serão analisadas com atenção pelo time interno. Se você for aprovado, entraremos em contato pelo número de WhatsApp informado.</p>':'<h1>Falta só um passo</h1><p class="h">Não foi possível enviar automaticamente. Envie suas respostas pelo WhatsApp para concluir a candidatura.</p>';
  if(!ok){const w=el('<div></div>');w.innerHTML=(WHATS?'<a class="b" id="wa" target="_blank" rel="noopener">Enviar pelo WhatsApp</a> ':'')+'<button class="b g" id="cp" style="margin-left:0">Copiar respostas</button><p class="tip">Se gravou o áudio, envie junto no mesmo chat.</p>';s.appendChild(w);if(WHATS)$("#wa").href="https://wa.me/"+WHATS+"?text="+encodeURIComponent(txt.slice(0,3500));$("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(txt);$("#cp").textContent="Copiado"}catch(e){}}}}}
$("#up").onclick=()=>go(i-1);$("#dn").onclick=()=>{if(i<0)go(0);else if(i<Q.length)next()};
go(-1);
</script></body></html>
